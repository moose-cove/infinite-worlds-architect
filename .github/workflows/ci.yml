name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mirror the pre-commit pytest gate: only run the suite when Python or
      # JSON (incl. JSON Schema) files changed vs. base. The job itself always
      # runs so the required "Tests" status check still reports — only the
      # pytest step below is skipped on docs-only changes.
      - name: Detect Python/JSON changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ]; then
              range=""
            else
              range="${before}..${{ github.sha }}"
            fi
          fi
          if [ -z "${range}" ]; then
            changed="true"   # no comparison point (e.g. new branch) — run to be safe
          elif git diff --name-only "${range}" | grep -qE '\.(py|json)$'; then
            changed="true"
          else
            changed="false"
          fi
          echo "Python/JSON changed: ${changed}"
          echo "code=${changed}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .tool-versions

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run pytest with coverage
        if: steps.changes.outputs.code == 'true'
        run: uv run pytest --no-header

  version-bump:
    name: Version bump check
    # Verifies plugin.json, pyproject.toml, and marketplace.json versions are bumped vs base
    # and equal to each other. See CLAUDE.md "Versioning policy" for the human-facing rules.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify plugin.json, pyproject.toml, and marketplace.json versions bumped and match
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          extract_pyproject() {
            python -c "
          import re, sys
          text = sys.stdin.read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE)
          print(m.group(1) if m else '')
          "
          }

          extract_plugin() {
            python -c "import json, sys; print(json.load(sys.stdin).get('version', ''))"
          }

          extract_marketplace() {
            python -c "import json, sys; d = json.load(sys.stdin); print(d.get('plugins', [{}])[0].get('version', ''))"
          }

          cur_py=$(cat pyproject.toml | extract_pyproject)
          cur_plugin=$(cat .claude-plugin/plugin.json | extract_plugin)
          cur_market=$(cat .claude-plugin/marketplace.json | extract_marketplace)
          base_py=$(git show "${base_ref}:pyproject.toml" | extract_pyproject)
          base_plugin=$(git show "${base_ref}:.claude-plugin/plugin.json" | extract_plugin)
          base_market=$(git show "${base_ref}:.claude-plugin/marketplace.json" | extract_marketplace)

          echo "Base    pyproject.toml:   ${base_py}"
          echo "Current pyproject.toml:   ${cur_py}"
          echo "Base    plugin.json:      ${base_plugin}"
          echo "Current plugin.json:      ${cur_plugin}"
          echo "Base    marketplace.json: ${base_market}"
          echo "Current marketplace.json: ${cur_market}"

          fail=0
          if [ "${cur_py}" = "${base_py}" ]; then
            echo "::error::pyproject.toml version was not bumped vs base. See CLAUDE.md 'Versioning policy'."
            fail=1
          fi
          if [ "${cur_plugin}" = "${base_plugin}" ]; then
            echo "::error::.claude-plugin/plugin.json version was not bumped vs base. See CLAUDE.md 'Versioning policy'."
            fail=1
          fi
          if [ "${cur_market}" = "${base_market}" ]; then
            echo "::error::.claude-plugin/marketplace.json version was not bumped vs base. See CLAUDE.md 'Versioning policy'."
            fail=1
          fi
          if [ "${cur_py}" != "${cur_plugin}" ] || [ "${cur_py}" != "${cur_market}" ]; then
            echo "::error::Version mismatch: pyproject.toml=${cur_py}, plugin.json=${cur_plugin}, marketplace.json=${cur_market}. All three must match."
            fail=1
          fi
          exit "${fail}"
