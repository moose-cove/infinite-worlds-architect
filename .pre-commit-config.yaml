# Pre-commit hooks mirror the GitHub Actions CI workflow in
# .github/workflows/ci.yml. All hooks run the venv's installed binaries
# rather than pinning their own copies — that way pyproject.toml is the
# single source of tool versions and pre-commit cannot drift from CI.
#
# Do NOT bypass with `git commit --no-verify`. See CLAUDE.md.
#
# To install hooks after cloning:    .venv/bin/pre-commit install
# To run hooks on the whole tree:    .venv/bin/pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (matches CI)
        entry: .venv/bin/ruff check
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format-check
        name: ruff format --check (matches CI)
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
        require_serial: true

      # pytest only runs when Python or JSON (incl. JSON Schema) files are
      # staged — a docs-only commit skips the suite. CI mirrors this: its
      # pytest step is gated on the same .py/.json change detection, so the
      # two stay aligned. pass_filenames is false so the FULL suite runs
      # whenever it triggers (not just the changed files).
      - id: pytest
        name: pytest with coverage (matches CI; skipped if no .py/.json changed)
        entry: .venv/bin/pytest --no-header -q
        language: system
        pass_filenames: false
        files: \.(py|json)$
