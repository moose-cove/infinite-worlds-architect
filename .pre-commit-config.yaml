# Pre-commit hooks mirror the GitHub Actions CI workflow in
# .github/workflows/ci.yml. All hooks run the venv's installed binaries
# rather than pinning their own copies — that way pyproject.toml is the
# single source of tool versions and pre-commit cannot drift from CI.
#
# Do NOT bypass with `git commit --no-verify`. See CLAUDE.md.
#
# To install hooks after cloning:    .venv/bin/pre-commit install
# To run hooks on the whole tree:    .venv/bin/pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (matches CI)
        entry: .venv/bin/ruff check
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format-check
        name: ruff format --check (matches CI)
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
        require_serial: true

      # pytest only runs when Python, JSON (incl. JSON Schema), or Markdown
      # files are staged. CI mirrors this: its pytest step is gated on the same
      # .py/.json/.md change detection, so the two stay aligned. pass_filenames
      # is false so the FULL suite runs whenever it triggers (not just the
      # changed files).
      #
      # .md is in the gate because tests/test_doc_links.py guards documentation
      # link integrity. Without it a docs-only commit would skip the suite —
      # precisely the commit most likely to break a link.
      - id: pytest
        name: pytest with coverage (matches CI; skipped if no .py/.json/.md changed)
        entry: .venv/bin/pytest --no-header -q
        language: system
        pass_filenames: false
        files: \.(py|json|md)$
