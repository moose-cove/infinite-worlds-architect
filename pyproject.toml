[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iw-architect"
version = "0.23.0"
description = "Infinite Worlds Architect — MCP plugin for building Infinite Worlds story worlds"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iw_architect"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_imports = true

[tool.coverage.run]
source = ["src/iw_architect"]
branch = true
omit = ["*/server.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/iw_architect --cov-report=term-missing -v"
